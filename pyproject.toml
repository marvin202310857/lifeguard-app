[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lifeguard-app"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "flask",
    "werkzeug",
    "supabase"
]

[tool.setuptools.packages.find]
where = ["."]

[tool.vercel]
entrypoint = "lifeguard.app:app"