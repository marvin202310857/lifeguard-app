<html lang="en">
<head>

  <title>{% block title %}LifeGuard{% endblock %}</title>
  <link rel="icon" href="{{ favicon_url }}">
  <link rel="stylesheet" href="{{ asset('css/base.css') }}">

</head>

</html>
